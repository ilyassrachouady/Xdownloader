services:
  extractor:
    build:
      context: ./services/extractor
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://savethex.com,https://www.savethex.com
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET:-dev-secret-change-me}
      CACHE_TTL: ${CACHE_TTL:-600}
      EXTRACTION_TIMEOUT: ${EXTRACTION_TIMEOUT:-90}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-10}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      HLS_DOWNLOAD_TIMEOUT: ${HLS_DOWNLOAD_TIMEOUT:-1800}
      ENVIRONMENT: development
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SITE_URL: https://savethex.com
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: https://savethex.com
    depends_on:
      - extractor
    restart: unless-stopped
