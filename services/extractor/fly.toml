# fly.toml app configuration file generated for SaveX extractor
# See https://fly.io/docs/reference/configuration/

app = "savex-extractor"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  EXTRACTION_TIMEOUT = "90"
  # Hour-long lives need long remux windows (seconds)
  HLS_DOWNLOAD_TIMEOUT = "7200"
  DOWNLOAD_TOKEN_TTL = "7200"
  # 4 GiB — high-quality hour+ replays
  MAX_DOWNLOAD_BYTES = "4294967296"
  CACHE_TTL = "600"
  RATE_LIMIT_REQUESTS = "30"
  RATE_LIMIT_WINDOW = "60"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# Live remux + large downloads need RAM
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
